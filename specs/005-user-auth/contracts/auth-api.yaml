openapi: 3.0.0
info:
  title: User Authentication API
  description: API for user authentication and profile management
  version: 1.0.0
servers:
  - url: https://api.example.com
    description: Production server
  - url: http://localhost:8000
    description: Development server

paths:
  /api/auth/signup:
    post:
      summary: Register a new user
      description: Creates a new user account with profile information
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistration'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/login:
    post:
      summary: Authenticate user
      description: Authenticates user with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLogin'
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/profile:
    get:
      summary: Get user profile
      description: Retrieves the authenticated user's profile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User profile retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Update user profile
      description: Updates the authenticated user's profile information
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfileUpdate'
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/ask:
    post:
      summary: Ask question to RAG system
      description: Ask a question to the RAG system with optional user context
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AskRequest'
      responses:
        '200':
          description: Question processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AskResponse'
        '401':
          description: Invalid token (if provided)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    UserRegistration:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: "user@example.com"
        password:
          type: string
          minLength: 8
          example: "securePassword123"
        hardware_exp:
          type: string
          enum: [beginner, intermediate, advanced, none]
          example: "beginner"
        software_exp:
          type: string
          enum: [beginner, intermediate, advanced, none]
          example: "intermediate"
        robotics_level:
          type: string
          enum: [beginner, intermediate, advanced]
          example: "beginner"
        goals:
          type: string
          example: "Learn ROS2 fundamentals"

    UserLogin:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: "user@example.com"
        password:
          type: string
          example: "securePassword123"

    UserProfileUpdate:
      type: object
      properties:
        hardware_exp:
          type: string
          enum: [beginner, intermediate, advanced, none]
          example: "intermediate"
        software_exp:
          type: string
          enum: [beginner, intermediate, advanced, none]
          example: "advanced"
        robotics_level:
          type: string
          enum: [beginner, intermediate, advanced]
          example: "intermediate"
        goals:
          type: string
          example: "Master humanoid robotics"

    UserResponse:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        email:
          type: string
          format: email
          example: "user@example.com"
        hardware_exp:
          type: string
          example: "beginner"
        software_exp:
          type: string
          example: "intermediate"
        robotics_level:
          type: string
          example: "beginner"
        goals:
          type: string
          example: "Learn ROS2 fundamentals"
        created_at:
          type: string
          format: date-time
          example: "2023-01-01T00:00:00Z"

    LoginResponse:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        email:
          type: string
          format: email
          example: "user@example.com"
        token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

    AskRequest:
      type: object
      required:
        - question
      properties:
        question:
          type: string
          example: "Explain ROS2 concepts"
        session_id:
          type: string
          example: "session-123"

    AskResponse:
      type: object
      properties:
        response:
          type: string
          example: "Personalized response based on user profile"
        sources:
          type: array
          items:
            type: string
          example: ["source1", "source2"]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: "Error message"
        details:
          type: object
          example: {}